name: Regenerate npm lockfile

on:
  push:
    branches: [fix/refresh-npm-lockfile]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/refresh-npm-lockfile
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          rm .github/workflows/regenerate-lockfile.yml
          git add -u .github/workflows/regenerate-lockfile.yml
          git commit -m "fix: regenerate npm lockfile for web app"
          git push origin HEAD:fix/refresh-npm-lockfile
